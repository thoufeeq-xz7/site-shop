services:
  - type: web
    name: stupup
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate && gunicorn ecommerce_project.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: /health/
    envVars:
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: "stupup.onrender.com,.onrender.com,127.0.0.1,localhost"
      - key: SECRET_KEY
        generateValue: true
